# Temporal: abre la app en Windows, toma capturas y las sube a la rama.
name: capturas
on: push
permissions:
  contents: write
jobs:
  capturas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: choco install ghostscript --no-progress -y
      - name: Compilar
        working-directory: win-pdf-achicador
        run: dotnet publish "Achicar PDF.csproj" -c Release -r win-x64 -o publish
      - name: Capturas
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            public struct R { public int L, T, Ri, B; }
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("dwmapi.dll")] public static extern int DwmGetWindowAttribute(IntPtr h, int a, out R r, int s);
          }
          "@
          $exe = (Resolve-Path "win-pdf-achicador/publish/Achicar PDF.exe").Path
          $cfg = "$env:APPDATA\Achicar PDF"
          New-Item -ItemType Directory -Force $cfg | Out-Null
          function Shot([string]$size, [string]$out, [string]$pdf, [int]$wait) {
            Set-Content "$cfg\tamano-maximo.txt" $size
            $p = if ($pdf) { Start-Process $exe -ArgumentList ('"' + (Resolve-Path $pdf).Path + '"') -PassThru } else { Start-Process $exe -PassThru }
            Start-Sleep $wait
            $p.Refresh()
            [W]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
            Start-Sleep 1
            $r = New-Object W+R
            [W]::DwmGetWindowAttribute($p.MainWindowHandle, 9, [ref]$r, 16) | Out-Null
            $bmp = New-Object System.Drawing.Bitmap ($r.Ri - $r.L), ($r.B - $r.T)
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $PWD $out))
            Stop-Process $p -Force
          }
          Shot "2" "assets/achicar-pdf-screenshot.png" "" 8
          Shot "1" "assets/achicar-pdf-resultado.png" "capturas/Contrato escaneado.pdf" 25
      - name: Subir capturas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.png
          git commit -m "Capturas de la v1.2"
          git push origin HEAD:${{ github.ref_name }}
