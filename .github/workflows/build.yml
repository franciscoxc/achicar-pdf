# En cada push: pruebas con Ghostscript real y los dos .exe en Windows.
# Con un tag v* (por ejemplo v1.2) además publica el release con RELEASE_NOTES_<tag>.md y los SHA-256.
name: build

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Instalar Ghostscript para las pruebas
        run: choco install ghostscript --no-progress -y

      - name: Pruebas
        run: dotnet test tests

      - name: Compilar x64 y ARM64
        working-directory: win-pdf-achicador
        run: |
          dotnet publish "Achicar PDF.csproj" -c Release -r win-x64 -o publish/win-x64
          dotnet publish "Achicar PDF.csproj" -c Release -r win-arm64 -o publish/win-arm64
          Copy-Item "publish/win-x64/Achicar PDF.exe" ../Achicar.PDF.x64.exe
          Copy-Item "publish/win-arm64/Achicar PDF.exe" ../Achicar.PDF.arm.exe

      - uses: actions/upload-artifact@v4
        with:
          name: achicar-pdf
          path: Achicar.PDF.*.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $sums = Get-ChildItem Achicar.PDF.*.exe | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $notes = (Get-Content "RELEASE_NOTES_$env:TAG.md" -Raw) + "`n## SHA-256`n`n" + '```text' + "`n" + ($sums -join "`n") + "`n" + '```' + "`n"
          Set-Content notes.md $notes
          gh release create $env:TAG Achicar.PDF.x64.exe Achicar.PDF.arm.exe --title "Achicar PDF $env:TAG" --notes-file notes.md
